<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Task Manager</title>

    <link
    rel="stylesheet"
    href="styles.css">

</head>

<body>

    <main class="container">

        <div class="app-card">

    <section id="auth-view">

        <h1>Task Manager</h1>

        <p class="subtitle">
            Create an account or log in to manage your tasks.
        </p>


        <section class="auth-section">

            <h2>Create Account</h2>

            <form id="register-form">

                <div class="form-group">
                    <label for="register-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="register-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Create Account
                </button>

            </form>

            <p
                id="register-message"
                class="form-message"
            ></p>

        </section>


        <hr>


        <section class="auth-section">

            <h2>Login</h2>

            <form id="login-form">

                <div class="form-group">
                    <label for="login-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Login
                </button>

            </form>

            <p
                id="login-message"
                class="form-message"
            ></p>

        </section>

    </section>


    <section
        id="dashboard-view"
        class="hidden"
    >

        <div class="dashboard-header">

            <div>
                <h1>Task Manager</h1>

                <p id="current-user-email"></p>
            </div>

            <button
                id="logout-button"
                class="secondary-button"
            >
                Logout
            </button>

        </div>


        <section class="task-form-section">

            <h2>Add Task</h2>

            <form id="task-form">

                <div class="form-group">
                    <label for="task-title">
                        Title
                    </label>

                    <input
                        type="text"
                        id="task-title"
                        maxlength="200"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="task-description">
                        Description
                    </label>

                    <textarea
                        id="task-description"
                        maxlength="1000"
                        rows="4"
                    ></textarea>
                </div>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Add Task
                </button>

            </form>

            <p
                id="task-form-message"
                class="form-message"
            ></p>

        </section>


        <section class="tasks-section">

            <h2>Your Tasks</h2>

            <p
                id="tasks-message"
                class="form-message"
            ></p>

            <div id="task-list"></div>

        </section>

    </section>

</div>

    </main>

    <script src="app.js"></script>

</body>

</html>
